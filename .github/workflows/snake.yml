
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Bernard-ctrl
          outputs: |
            dist/github-snake.svg?color_snake=%230f766e&color_dots=%23e2e8f0,%2399f6e4,%235eead4,%2314b8a6,%230f766e
            dist/github-snake-dark.svg?color_snake=%235eead4&color_dots=%23334155,%230f766e,%2314b8a6,%235eead4,%23ccfbf1

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
